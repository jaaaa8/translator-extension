<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font-family: "Segoe UI", sans-serif; width: 220px; padding: 10px; }
      label { display: block; margin: 8px 0 2px; font-size: 12px; color: #555; }
      select { width: 100%; }
      #status, #cacheStatus { margin-top: 10px; font-size: 12px; }
      #currentLanguages { margin-top: 8px; font-size: 12px; color: #555; }
      .row { display: flex; align-items: center; gap: 6px; }
      .action { width: 100%; margin-top: 12px; padding: 8px; font-weight: bold; cursor: pointer; }
      .action + .action { margin-top: 6px; }
    </style>
  </head>
  <body>
    <div class="row">
      <input type="checkbox" id="enabled" />
      <b>Bật dịch</b>
    </div>
    <label for="srcLang">Ngôn ngữ nguồn</label>
    <select id="srcLang">
      <option value="ja">Tiếng Nhật</option>
      <option value="es">Tiếng Tây Ban Nha</option>
      <option value="pt">Tiếng Bồ Đào Nha</option>
    </select>
    <label for="dstLang">Ngôn ngữ đích</label>
    <select id="dstLang">
      <option value="vi">Tiếng Việt</option>
      <option value="en">Tiếng Anh</option>
    </select>
    <div id="currentLanguages"></div>
    <label for="readingDirection">Hướng đọc</label>
    <select id="readingDirection">
      <option value="rtl">Phải sang trái (RTL)</option>
      <option value="ltr">Trái sang phải (LTR)</option>
    </select>
    <button id="translateLoaded" class="action">Dịch webtoon đã tải</button>
    <button id="translateVisible" class="action">Dịch trang đang xem</button>
    <div id="result" style="margin-top: 6px; font-size: 12px; color: #555"></div>
    <div id="cacheStatus">Đang dịch nền: 0 · Đã cache: 0 · Lỗi: 0</div>
    <div id="status">● đang kiểm tra server…</div>
    <script src="popup.js"></script>
  </body>
</html>
